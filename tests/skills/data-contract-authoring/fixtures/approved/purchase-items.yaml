        logicalType: integer
        required: false

      - name: item_description
        description: Description of the item, as supplied by the source.
        logicalType: string
        required: false

      - name: quantity
        description: Quantity reported by the source. The source type is decimal; precision and scale are not specified.
        logicalType: number
        required: false
