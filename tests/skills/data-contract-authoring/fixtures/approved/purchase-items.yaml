description:
  purpose: Provide purchase item records for analytical consumption.
  limitations: >
    SYNTHETIC TEST FIXTURE. Not approved by any real producer.
    Producer: procurement-api (simulated).
    Record grain is one purchase item returned by the source API.
    The source has not confirmed any primary key, uniqueness constraint, or identity rule for item_id or purchase_id.
    All fields may be null; null handling and business meaning of nulls have not been confirmed.
    The precision and scale of quantity have not been specified.
